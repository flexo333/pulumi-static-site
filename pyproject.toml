[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulumi-static-site"
version = "0.4.0"
description = "Reusable Pulumi ComponentResource for S3 + CloudFront static sites on AWS"
requires-python = ">=3.9"
dependencies = [
    "pulumi>=3.0.0,<4.0.0",
    "pulumi-aws>=7.0.0,<8.0.0",
]

[project.optional-dependencies]
dev = ["pytest"]
